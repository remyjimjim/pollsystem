name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (gradle test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Provisions Gradle 8.10.2 (matching gradle-wrapper.properties) and
      # caches the Gradle user home and build cache between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Testcontainers needs Docker; Ubuntu runners have it pre-installed.
      # Output is kept for the failure summary below (shell: bash adds
      # pipefail, so a test failure still fails this step).
      - name: Run tests
        shell: bash
        run: gradle test --no-daemon --stacktrace 2>&1 | tee gradle-test.log

      # On failure, publish each failing test (name + error) as an annotation.
      # Annotations are readable without a GitHub login, unlike job logs and
      # artifacts. If no test results exist (the build failed before tests
      # ran, e.g. Docker), publish the end of the output and the Docker
      # version instead.
      - name: Summarise failures
        if: failure()
        shell: bash
        run: |
          echo "::notice title=Docker::$(docker version --format 'server {{.Server.Version}} API {{.Server.APIVersion}} (min {{.Server.MinAPIVersion}})' 2>&1 | head -1)"
          python3 - <<'EOF'
          import glob, re, html
          def esc(s): return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          found = 0
          for path in sorted(glob.glob('build/test-results/test/TEST-*.xml')):
              xml = open(path, encoding='utf-8', errors='replace').read()
              cls = path.split('TEST-')[-1][:-4].split('.')[-1]
              for name, body in re.findall(r'<testcase name="([^"]*)"[^>]*>(.*?)</testcase>', xml, re.S):
                  m = re.search(r'<(failure|error) message="([^"]*)"[^>]*>(.*?)</\1>', body, re.S)
                  if not m:
                      continue
                  found += 1
                  trace = html.unescape(m.group(3)).strip().splitlines()[:12]
                  print(f"::error title={esc(cls)}: {esc(html.unescape(name))[:180]}::{esc(html.unescape(m.group(2))[:600] + chr(10) + chr(10).join(trace))}")
          if found == 0:
              tail = open('gradle-test.log', encoding='utf-8', errors='replace').read().splitlines()[-60:]
              print("::error title=No failing test recorded (build failed before or outside tests)::" + esc(chr(10).join(tail)))
          EOF

      # Upload reports on failure for diagnostics.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Frontend (type-check + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Enable npm cache once frontend/package-lock.json is committed:
          # cache: npm
          # cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # The Playwright specs drive the real app: they register users through the
    # UI, and read the magic-link emails back out of Mailpit. So the whole stack
    # has to be up — Postgres, Mailpit, the Spring backend (local profile), and
    # the Vite dev server — before the specs run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polladmin
          POSTGRES_PASSWORD: pollpass123
          POSTGRES_DB: pollsystem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polladmin -d pollsystem"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025   # SMTP — MailConfig's local profile points here
          - 8025:8025   # HTTP API — the specs read magic links from here

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Start the backend in the background on the `local` profile (Mailpit mail,
      # Flyway migrations + seed-local, the /api/dev/* endpoints the specs use).
      - name: Start backend
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: local
          # Simulated checkout (payment/MockPaymentProvider), as docker-compose
          # sets locally. Without it the backend tries real Stripe with no keys
          # and every registration fails with "Could not start checkout".
          APP_PAYMENTS_PROVIDER: mock
        run: |
          nohup gradle bootRun --no-daemon > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then echo "backend up"; break; fi
            if [ "$i" = 60 ]; then echo "backend failed to start"; tail -n 100 backend.log; exit 1; fi
            sleep 3
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          nohup npm run dev > frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 >/dev/null; then echo "frontend up"; break; fi
            if [ "$i" = 30 ]; then echo "frontend failed to start"; tail -n 100 frontend.log; exit 1; fi
            sleep 2
          done

      - name: Wait for Mailpit
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8025/api/v1/messages >/dev/null; then echo "mailpit up"; break; fi
            if [ "$i" = 30 ]; then echo "mailpit not reachable"; exit 1; fi
            sleep 2
          done

      # Runs every spec under frontend/e2e on one worker (playwright.config.ts),
      # so new specs are picked up automatically. The interactive
      # seed-users-debug spec is excluded there when CI is set. (This used to
      # list spec files by name, which went stale when the specs were renamed.)
      - name: Run e2e specs
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/frontend.log
            backend/backend.log
          retention-days: 7
          if-no-files-found: ignore
