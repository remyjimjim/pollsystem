<div class="row light"><div class="tab"><img src="favicon.svg" width="16" height="16">BallotBox</div>

 <figure><img src="favicon.svg" width="16"><br>16</figure><figure><img src="favicon.svg" width="32"><br>32</figure><figure><img src="favicon.svg" width="64"><br>64</figure></div>
</body></html>
