# Test profile config. Datasource is overridden by @ServiceConnection in
# AbstractIntegrationTest, so we only need values that don't depend on the DB.

spring:
  jpa:
    show-sql: true
  # Each distinct test setup (a set of @Import / @TestPropertySource) is a cached
  # Spring context with its own connection pool, all against one Postgres
  # container (max_connections 100). Tests in a context run one at a time, so a
  # small pool is plenty; at Hikari's default of 10, about ten contexts used up
  # every connection ("too many clients already", 2026-10-23).
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

app:
  jwt:
    # Deterministic 32+ byte key for HS256 in tests
    secret: test-secret-key-must-be-at-least-32-characters
    expiration-ms: 3600000
  results:
    k-anonymity-threshold: 3  # lower threshold makes results tests easier
  rate-limit:
    enabled: false  # RateLimitTest turns it on
  creator-requests:
    sweep-interval-ms: 3600000  # don't run the sweep cron during tests

# This file REPLACES src/main/resources/application.yml on the test classpath,
# so repeat its "springdoc off" default here (springdoc's own default is on).
# LocalOnlyToolsTest guards it; only application-local.yml turns it on.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
