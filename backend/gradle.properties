# Bound the Gradle daemon so it can't balloon or linger and starve the shared
# Docker Desktop VM. (The IDE's Gradle importer was the big idle hog at ~1 GB;
# these settings cap and reap any daemon a manual ./gradlew run starts.)
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m
# Let an idle daemon exit after 10 minutes instead of squatting RAM for hours.
org.gradle.daemon.idletimeout=600000
