# Fly.io config for the pollsystem backend (Spring Boot / JVM).
# Deploy from backend/:  flyctl deploy -a pollsystem-backend
# Secrets (Neon Postgres URL, Upstash Redis, email + Stripe keys) are set via
# `flyctl secrets set` — see docs/DEPLOYING-FLY.md.

app = "pollsystem-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Any profile other than "local" makes MailConfig wire the production
  # JavaMailSender and skips the db/seed-local dev fixtures. The datasource,
  # JWT secret, Stripe, and email creds are injected as secrets (relaxed
  # binding: SPRING_DATASOURCE_URL -> spring.datasource.url, etc.).
  SPRING_PROFILES_ACTIVE = "prod"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true        # stop when idle — no compute charge while stopped
  auto_start_machines = true       # wake on the next request
  min_machines_running = 1         # keep one warm to avoid cold-start on every hit
  processes = ["app"]

# Health check hits the actuator endpoint (spring-boot-starter-actuator is a
# dependency; application.yml exposes `health`). Generous grace for JVM boot.
[[http_service.checks]]
  grace_period = "45s"
  interval = "15s"
  timeout = "3s"
  method = "GET"
  path = "/actuator/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048                 # comfortable for the JVM; 1024 is tight
